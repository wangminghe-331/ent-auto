name: 娱乐监控台-每日三次刷新

on:
  schedule:
    # 北京时间每日三班：07:00 / 11:00 / 17:30。每个时间点额外加一个 +15 分钟冗余触发，
    # 规避 GitHub 免费调度器高峰期偶发跳跑（同窗口两次机会，同时被跳过概率极低）。
    - cron: "0,15 23,3 * * *"    # 北京 07:00/07:15 与 11:00/11:15
    - cron: "30,45 9 * * *"      # 北京 17:30/17:45
  workflow_dispatch: {}   # 允许在 Actions 页面手动点 Run workflow 立即测试

permissions:
  contents: write        # 允许 workflow 把生成的 data.json 提交回仓库

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 抓取热点 + 生成图文
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_API_URL: ${{ secrets.LLM_API_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: python scraper.py

      - name: 提交 data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "auto refresh $(date -u +%Y-%m-%dT%H:%M:%SZ)" || echo "no changes"
          # 冗余触发可能并发，push 冲突时交由另一班覆盖，数据仍是最新，不标红失败
          git push || echo "push skipped: another concurrent run likely succeeded, data remains fresh"
